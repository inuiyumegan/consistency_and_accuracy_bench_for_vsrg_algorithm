name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Installs the package itself (not just its deps), which also validates
      # that pyproject.toml is installable.
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # The benchmark dataset (samples/4k/) ships with the repo, so the
      # dataset-dependent tests run for real here. They self-skip only if the
      # data is stripped from the checkout.
      - name: Run test suite
        run: pytest tests/ -v
